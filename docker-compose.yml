name: careops

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: careops-web:latest
    container_name: careops-web
    ports:
      - "3000:3000"
    # Optional runtime config; the container starts fine without a .env file.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
