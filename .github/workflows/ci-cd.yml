name: CI/CD

# Continuous Integration runs on every push and every pull request.
# Continuous Delivery (the docker-publish job) only runs after CI has
# passed AND the change has landed on main, so a broken build can never
# reach the registry.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 26
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------
  # Continuous Integration: install, lint, type-check, test, build.
  # Every stage must pass before an image is ever built.
  # ---------------------------------------------------------------------
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json ("packageManager").
      # Must run before setup-node so that its pnpm cache can find pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  # ---------------------------------------------------------------------
  # Continuous Delivery: build a container image and publish it to
  # GitHub Container Registry. Only runs for pushes to main, and only
  # once the "ci" job above has succeeded.
  # ---------------------------------------------------------------------
  docker-publish:
    name: Build & Publish Container Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Feedback loop: report the pipeline outcome back to the team/commit,
  # whether the preceding jobs succeeded or failed.
  # ---------------------------------------------------------------------
  notify:
    name: Report pipeline result
    needs: [ci, docker-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post status to the commit
        uses: actions/github-script@v7
        with:
          script: |
            const ci = '${{ needs.ci.result }}';
            const publish = '${{ needs.docker-publish.result }}';
            const state = ci === 'success' ? 'success' : 'failure';
            const description =
              ci !== 'success'
                ? 'CI failed: lint/typecheck/test/build did not pass.'
                : publish === 'skipped'
                  ? 'CI passed (image publish skipped for this branch/PR).'
                  : publish === 'success'
                    ? 'CI passed and image published to GHCR.'
                    : 'CI passed but the Docker publish step failed.';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ci-cd/summary',
              description,
            });
