name: CI/CD

# Continuous Integration runs on every push and every pull request.
# Continuous Delivery (the docker-publish job) only runs after CI has
# passed AND the change has landed on main, so a broken build can never
# reach the registry. Continuous Deployment (the deploy job) then rolls
# that exact image out to Render and smoke-tests the live site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 26
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------
  # Continuous Integration: install, lint, type-check, test, build.
  # Every stage must pass before an image is ever built.
  # ---------------------------------------------------------------------
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      # Must run before setup-node so that its pnpm cache can find pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  # ---------------------------------------------------------------------
  # Continuous Delivery: build a container image and publish it to
  # GitHub Container Registry. Only runs for pushes to main, and only
  # once the "ci" job above has succeeded.
  # ---------------------------------------------------------------------
  docker-publish:
    name: Build & Publish Container Image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Continuous Deployment: tell Render to run the exact image that was
  # just tested and published (sha-<short sha>, never "latest"), then
  # smoke-test the live site.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # Never run two deploys at once; a queued deploy waits instead of
    # racing (and possibly rolling back) the one in progress.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi

          # Same tag docker/metadata-action produces for type=sha,format=short.
          # GHCR requires lowercase repository names.
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          ENCODED_IMAGE=$(jq -rn --arg v "$IMAGE" '$v|@uri')
          echo "Deploying image: $IMAGE"

          # The hook URL is never echoed; GitHub also masks it as a secret.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            -X POST "${DEPLOY_HOOK_URL}&imgURL=${ENCODED_IMAGE}") || STATUS="000"
          echo "Render deploy hook responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::error::Render deploy hook returned HTTP $STATUS (expected 200 or 202)."
            exit 1
          fi

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "::error::Variable PRODUCTION_URL is not set."
            exit 1
          fi
          BASE_URL="${PRODUCTION_URL%/}"

          # Render keeps serving the previous deploy until the new one is up,
          # and free instances cold-start slowly. So poll /api/version until it
          # reports the commit we just tested, then check the page itself.
          # One shared budget of ~5 minutes covers both checks.
          BUDGET=300
          START=$SECONDS
          BODY=$(mktemp)
          VERSION=$(mktemp)
          attempt=0
          ACTUAL_SHA="(none)"
          PAGE_STATUS="(not checked)"
          while [ $((SECONDS - START)) -lt "$BUDGET" ]; do
            attempt=$((attempt + 1))
            V_STATUS=$(curl -sS -L -o "$VERSION" -w '%{http_code}' --max-time 30 \
              -H 'Cache-Control: no-cache' "$BASE_URL/api/version") || V_STATUS="000"
            ACTUAL_SHA=$(jq -r '.sha // "(missing)"' "$VERSION" 2>/dev/null) || ACTUAL_SHA="(not JSON, HTTP $V_STATUS)"
            echo "Attempt $attempt ($((SECONDS - START))s): /api/version HTTP $V_STATUS | expected sha=$EXPECTED_SHA | actual sha=$ACTUAL_SHA"

            if [ "$V_STATUS" = "200" ] && [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              PAGE_STATUS=$(curl -sS -L -o "$BODY" -w '%{http_code}' --max-time 30 "$BASE_URL") || PAGE_STATUS="000"
              echo "  page $BASE_URL: HTTP $PAGE_STATUS"
              if [ "$PAGE_STATUS" = "200" ]; then
                if grep -q "CareOps" "$BODY"; then
                  echo "Smoke test passed after $((SECONDS - START))s: commit $EXPECTED_SHA is live, HTTP 200 and page contains \"CareOps\"."
                  exit 0
                fi
                echo "::error::Commit $EXPECTED_SHA is live and the page returned HTTP 200, but it does not contain \"CareOps\"."
                exit 1
              fi
            fi
            sleep 10
          done

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Deployed version never matched within ${BUDGET}s: expected sha $EXPECTED_SHA, production reports $ACTUAL_SHA. The new deploy did not go live (check the Render dashboard)."
          else
            echo "::error::Commit $EXPECTED_SHA is live, but $BASE_URL did not return HTTP 200 within ${BUDGET}s (last: HTTP $PAGE_STATUS)."
          fi
          exit 1

  # ---------------------------------------------------------------------
  # Feedback loop: report the pipeline outcome back to the team/commit,
  # whether the preceding jobs succeeded or failed.
  # ---------------------------------------------------------------------
  notify:
    name: Report pipeline result
    needs: [ci, docker-publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post status to the commit
        uses: actions/github-script@v9
        with:
          script: |
            const ci = '${{ needs.ci.result }}';
            const publish = '${{ needs.docker-publish.result }}';
            const deploy = '${{ needs.deploy.result }}';

            let state = 'failure';
            let description;
            if (ci !== 'success') {
              description = `CI failed (${ci}): lint/typecheck/test/build did not pass.`;
            } else if (publish === 'skipped') {
              state = 'success';
              description = 'CI passed (publish and deploy skipped for this branch/PR).';
            } else if (publish !== 'success') {
              description = `CI passed but the Docker publish stage failed (${publish}).`;
            } else if (deploy !== 'success') {
              description = `Image published but the deploy stage failed (${deploy}): deploy hook or smoke test.`;
            } else {
              state = 'success';
              description = 'CI passed, image published and deployed to production';
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ci-cd/summary',
              description,
            });
